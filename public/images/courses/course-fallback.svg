<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fallbackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061f18" />
      <stop offset="50%" stop-color="#0d3b2f" />
      <stop offset="100%" stop-color="#041410" />
    </linearGradient>
    <radialGradient id="fallbackGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#041410" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldLustre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#fallbackBg)" />
  <rect width="100%" height="100%" fill="url(#fallbackGlow)" />
  <g transform="translate(400, 200)" text-anchor="middle">
    <!-- Star rosette -->
    <circle r="115" fill="none" stroke="#10b981" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6" />
    <circle r="85" fill="#072920" stroke="#34d399" stroke-opacity="0.25" stroke-width="1.5" />
    <!-- Quran book icon -->
    <path d="M-26 10 C-13 2 -3 11 0 13 C3 11 13 2 26 10 L22 -10 C11 -15 3 -10 0 -8 C-3 -10 -11 -15 -22 -10 Z" fill="#031a14" stroke="url(#goldLustre)" stroke-width="1.8" />
    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ecfdf5">برنامه یادگیری قرآن</text>
    <text y="95" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6ee7b7">Quran Learning Plan</text>
  </g>
</svg>
