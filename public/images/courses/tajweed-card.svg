<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tajweedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052019" />
      <stop offset="50%" stop-color="#0c3d31" />
      <stop offset="100%" stop-color="#021410" />
    </linearGradient>
    <radialGradient id="tajweedGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#021410" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#tajweedBg)" />
  <rect width="100%" height="100%" fill="url(#tajweedGlow)" />
  <g transform="translate(400, 200)" text-anchor="middle">
    <!-- Concentric Circles & Waves for Sound/Recitation -->
    <circle r="130" fill="none" stroke="#10b981" stroke-opacity="0.1" stroke-width="1" />
    <circle r="105" fill="none" stroke="#34d399" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="8 6" />
    <circle r="80" fill="#062e24" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.5" />
    <!-- Audio Wave / Tajweed symbol -->
    <path d="M-40 0 C-30 -25 -20 25 -10 -15 C0 20 10 -25 20 15 C30 -20 40 0 40 0" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6" fill="#10b981" />
    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f0fdf4">تجوید و ترتیل قرآن</text>
    <text y="95" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#6ee7b7">Tajweed &amp; Quranic Recitation</text>
  </g>
</svg>
