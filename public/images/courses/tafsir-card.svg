<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tafsirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26" />
      <stop offset="50%" stop-color="#0f3448" />
      <stop offset="100%" stop-color="#041018" />
    </linearGradient>
    <radialGradient id="tafsirGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#041018" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="blueGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#tafsirBg)" />
  <rect width="100%" height="100%" fill="url(#tafsirGlow)" />
  <g transform="translate(400, 200)" text-anchor="middle">
    <!-- Starburst & Book for Tafsir Reflection -->
    <circle r="120" fill="none" stroke="#0284c7" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="6 6" />
    <circle r="85" fill="#082838" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" />
    <!-- Open Book / Insight Icon -->
    <path d="M-30 8 C-15 0 -4 10 0 12 C4 10 15 0 30 8 L26 -14 C13 -20 4 -14 0 -12 C-4 -14 -13 -20 -26 -14 Z" fill="#041924" stroke="url(#blueGold)" stroke-width="1.8" />
    <text y="70" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f0f9ff">تفسیر و تدبر در آیات</text>
    <text y="95" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#7dd3fc">Tafsir &amp; Quranic Reflection</text>
  </g>
